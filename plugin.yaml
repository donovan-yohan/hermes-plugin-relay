manifest_version: 2
name: hermes-plugin-relay
label: Relay Desktop Backend
version: 0.2.0.dev0
kind: standalone
author: Nous Research
description: >
  Backend-only, loopback-only proxy from Hermes Desktop to Relay's stable channel
  API. It owns an operator-client credential in process memory and exposes no
  providers, participants, tools, credentials, grants, or streaming endpoints.

requires_env: []
optional_env:
  - RELAY_IDE_URL
  - RELAY_IDE_OPERATOR_CLIENT_TOKEN
  - RELAY_IDE_OPERATOR_GRANT
