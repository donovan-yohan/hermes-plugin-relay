manifest_version: 2
name: hermes-plugin-relay
label: Relay Workspace
version: 0.2.0.dev0
kind: standalone
author: Nous Research
description: >
  Native Hermes Desktop workspace for a local Relay hub. A loopback-only backend
  owns the short-lived operator-client credential while the renderer lists
  channels, shows transcripts, and posts messages. It exposes no provider or
  participant runtime, Hermes tools, credential material, or fake stream.

requires_env: []
optional_env:
  - RELAY_IDE_URL
  - RELAY_IDE_OPERATOR_CLIENT_TOKEN
  - RELAY_IDE_OPERATOR_GRANT
